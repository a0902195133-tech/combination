<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 輪播圖與 12 張卡片布局</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container my-5">

       
        <div id="mainCarousel" class="carousel slide mb-5 shadow-sm rounded-4 overflow-hidden" data-bs-ride="carousel">
           
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
            </div>

          
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://placehold.co/1200x450/2c3e50/ffffff?text=Slide+1" class="d-block w-100" alt="輪播圖 1">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>第一張輪播圖</h5>
                        <p>這裡可以放輪播圖的簡短說明文字。</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://placehold.co/1200x450/34495e/ffffff?text=Slide+2" class="d-block w-100" alt="輪播圖 2">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>第二張輪播圖</h5>
                        <p>這裡可以放輪播圖的簡短說明文字。</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://placehold.co/1200x450/16a085/ffffff?text=Slide+3" class="d-block w-100" alt="輪播圖 3">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>第三張輪播圖</h5>
                        <p>這裡可以放輪播圖的簡短說明文字。</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://placehold.co/1200x450/2980b9/ffffff?text=Slide+4" class="d-block w-100" alt="輪播圖 4">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>第四張輪播圖</h5>
                        <p>這裡可以放輪播圖的簡短說明文字。</p>
                    </div>
                </div>
            </div>

            <!-- 左右切換按鈕 -->
            <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">上一張</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">下一張</span>
            </button>
        </div>

        <!-- 2. 卡片網格區塊 (共 12 張卡片) -->
        <!-- 斷點設定：576px以下 1欄 (col-12) / 576-768px 2欄 (col-sm-6) / 768-1200px 4欄 (col-md-3) / 1200px以上 6欄 (col-xl-2) -->
        <div class="row g-4">

            <!-- 卡片 1 -->
            <div class="col-12 col-sm-6 col-md-3 col-xl-2">
                <div class="card h-100 shadow-sm">
                    <img src="https://picsum.photos/id/116/500/500" class="card-img-top" alt="卡片 1">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">卡片標題 1</h5>
                        <p class="card-text">這是卡片的簡短內容描述文字。</p>
                        <a href="#" class="btn btn-primary mt-auto">查看詳情</a>
                    </div>
                </div>
            </div>

                        <a href="#" class="btn btn-primary mt-auto">查看詳情</a>
                    </div>
                </div>
            </div>

            <!-- 卡片 4 -->

                <div class="card h-100 shadow-sm">
                    <img src="https://picsum.photos/id/116/500/500" class="card-img-top" alt="卡片 1">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">卡片標題 1</h5>
                        <p class="card-text">這是卡片的簡短內容描述文字。</p>

                    </div>
                </div>
            </div>

            <!-- 卡片 4 -->

                    <img src="https://picsum.photos/id/116/500/500" class="card-img-top" alt="卡片 1">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">卡片標題 1</h5>
                        <p class="card-text">這是卡片的簡短內容描述文字。</p>

                    </div>
                </div>
            </div>
