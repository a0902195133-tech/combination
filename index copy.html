<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 輪播與卡片</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Bootstrap 沒有 1280 的斷點，這裡自訂 */
    @media (min-width: 1280px) {
      .cards > .col { width: 16.666667%; }
    }
  </style>
</head>
<body>
  <div class="container py-4">

    <!-- 輪播 -->
    <div id="carousel" class="carousel slide mx-auto mb-5" style="max-width: 500px">
      <div class="carousel-indicators">
        <button data-bs-target="#carousel" data-bs-slide-to="0" class="active"></button>
        <button data-bs-target="#carousel" data-bs-slide-to="1"></button>
        <button data-bs-target="#carousel" data-bs-slide-to="2"></button>
        <button data-bs-target="#carousel" data-bs-slide-to="3"></button>
      </div>
      <div class="carousel-inner rounded-5">
        <div class="carousel-item active"><img src="https://picsum.photos/id/42/500/500" class="d-block w-100" alt="圖片 1"></div>
        <div class="carousel-item"><img src="https://picsum.photos/id/89/500/500" class="d-block w-100" alt="圖片 2"></div>
        <div class="carousel-item"><img src="https://picsum.photos/id/184/500/500" class="d-block w-100" alt="圖片 3"></div>
        <div class="carousel-item"><img src="https://picsum.photos/id/116/500/500" class="d-block w-100" alt="圖片 4"></div>
      </div>
      <button class="carousel-control-prev" data-bs-target="#carousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" data-bs-target="#carousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- 卡片：<576 一排1個、576~768 一排2個、768~1280 一排4個、≥1280 一排6個 -->
    <div id="cards" class="cards row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 12 張卡片的圖片 ID（與原本相同）
    const ids = [42, 42, 42, 42, 42, 42, 67, 53, 68, 79, 112, 6];

    document.getElementById("cards").innerHTML = ids.map(id => `
      <div class="col">
        <div class="card h-100">
          <img src="https://picsum.photos/id/${id}/500/500" class="card-img-top" alt="...">
          <div class="card-body">
            <h4 class="card-title">Card title</h4>
            <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
            <a href="#" class="btn btn-primary">Go somewhere</a>
          </div>
        </div>
      </div>`).join("");
  </script>
</body>
</html>
